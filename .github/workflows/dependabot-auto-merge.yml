name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's pull requests that hold no major update and touch no GitHub Actions:
# the npm group's minor and patch updates (see dependabot.yml), and security updates, which skip the cooldown and come
# as a group of their own (npm_and_yarn) or one at a time. GitHub then merges each one once Vercel's preview build, the
# required check (.github/settings.yml), passes, and the merge's push to main deploys through Vercel's Git integration.
# Major updates and the GitHub Actions ecosystem's updates wait for a person. For a group, update-type is its largest
# update, so a security group carrying a major one waits too.
#
# Auto-merge is turned on with the DEPENDABOT_MERGE_TOKEN secret, not GITHUB_TOKEN. GitHub credits the merge to whoever
# turned auto-merge on, and starts no workflows for a push credited to GITHUB_TOKEN: none runs on a push here today, but
# one added later would be skipped without a word. The token is a fine-grained personal access token for this repository
# only, with read and write access to Contents and Pull requests. It has no access to workflows, so it couldn't merge
# the GitHub Actions updates even by mistake. It's a Dependabot secret because runs started by Dependabot can only read
# Dependabot secrets.
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    # Only for Dependabot's own pushes. A person who pushes to its pull request (to fix the lockfile, say) takes the
    # pull request over and merges it themselves; their push's run can't read Dependabot secrets in any case.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge once Vercel's build passes
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major'
          && steps.metadata.outputs.package-ecosystem != 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
