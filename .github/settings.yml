# Repository configuration, managed by the Settings app
# (https://github.com/repository-settings/app). The shared defaults come from
# regulad/.github; this file sets only what is this repository's own.
_extends: .github

repository:
  name: ml4webedit
  description: >-
    Toggle Hard Mode on an existing Mario & Luigi: Dream Team (3DS) save, right in the browser.
  homepage: https://ml4webedit.vercel.app
  private: false
  # Topics: comma-and-space separated string, NOT a YAML list.
  topics: mario-and-luigi, dream-team, nintendo-3ds, 3ds, save-editor, hard-mode, azahar, citra, reverse-engineering, react, vite, typescript
  default_branch: main

labels:
  # Dependabot's, for its npm pull requests.
  - name: javascript
    color: "168700"
    description: Pull requests that update javascript code
